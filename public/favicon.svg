<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- SODAGRO Tree & Furrow Emblem -->
  <g transform="translate(4, 4)">
    <circle cx="20" cy="20" r="19" fill="#244d36" />
    <!-- Golden Root / Furrow Curve -->
    <path d="M10 28 C15 32, 25 32, 30 28" stroke="#ffdcbc" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M13 32 C17 35, 23 35, 27 32" stroke="#eebe8d" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <!-- Stylized Olive Branch & Leaves -->
    <path d="M20 28 L20 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M20 21 C15 19, 13 14, 15 11 C17 11, 20 15, 20 17 Z" fill="#beecb0"/>
    <!-- Right Leaf -->
    <path d="M20 17 C22 13, 27 10, 28 12 C28 15, 25 18, 20 20 Z" fill="#91bd9f"/>
