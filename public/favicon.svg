    <circle cx="20" cy="10" r="2.5" fill="#ffffff" />
  </g>
  <!-- Brand Typography -->
  <text x="52" y="27" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="#0a3621" letter-spacing="-0.5">SODAGRO</text>
  <text x="53" y="38" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#446c3c" letter-spacing="1.2">SOLUCIONES AGRÍCOLAS</text>
</svg>
